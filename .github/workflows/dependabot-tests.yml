name: Dependabot Tests

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48 # ratchet:mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Web Components Test
        run: npm run test:wc